[project]
name = "PachSlot-ML"
version = "0.1.0"
description = "Monorepo Root Workspace"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "pyright>=1.1.380",
    "ruff>=0.6.0",
]

[tool.uv]
workspace = { members = ["common", "data-pipeline", "ml-models", "web-app"] }

[tool.pytest.ini_options]
testpaths = [
    "common/tests",
    "data-pipeline/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=common/src/container --cov-report=term-missing --cov-report=xml"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    "common/src",
    "data-pipeline/src",
    "ml-models/src",
    "web-app/src"
]
pythonVersion = "3.14"
typeCheckingMode = "strict"  # standard から strict へ変更し、厳格な型安全性を強制
reportMissingTypeStubs = "warning"

[tool.ruff]
target-version = "py314"     # Python 3.14 構文規約を明示
line-length = 120
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "N",        # pep8-naming
    "ASYNC",    # flake8-async
    "RUF",      # Ruff-specific rules
]
ignore = [
    "E501",     # Line too long
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
