[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "common"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "charset-normalizer>=3.4.7",
    "httpx>=0.28.1",
    "jaconv>=0.5.0",
    "pathvalidate>=3.3.1",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pyright]
venvPath = ".."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"

extraPaths = [
    "src",
    "../data-pipeline/src",
    "../ml-models/src",
    "../web-app/src"
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/slot",
    "src/webclient",
]
