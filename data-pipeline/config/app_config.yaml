app:
  name: "PachiSlotML-DataPipeline"
  environment: "development"
  timeout_seconds: 30

logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    standard:
      format: "[%(asctime)s] %(levelname)s [%(name)s.%(funcName)s:%(lineno)d] %(message)s"
  handlers:
    stdout:
      class: "logging.StreamHandler"
      stream: "ext://sys.stdout"
      formatter: "standard"
  root:
    level: "INFO"
    handlers: ["stdout"]
