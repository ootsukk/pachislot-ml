[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-models"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "common",
]

[tool.pyright]
venvPath = ".."
venv = ".venv"

extraPaths = ["src"]
pythonVersion = "3.14"

[tool.uv.sources]
common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ml_models"]
